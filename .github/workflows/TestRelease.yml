name: Reader Beta Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit on master to build
        required: false
        type: string

concurrency:
  group: reader-beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.commit_sha || github.sha }}
      - id: ref
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          git fetch origin master --tags
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "Commit must belong to master: $COMMIT_SHA" >&2
            exit 1
          fi
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
      - id: version
        run: |
          chmod +x .github/scripts/reader-version.sh
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(bash .github/scripts/reader-version.sh)

  credentials:
    needs: prepare
    if: needs.prepare.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [[ -n "$RELEASE_KEY_STORE" && -n "$RELEASE_KEY_ALIAS" && \
                -n "$RELEASE_KEY_PASSWORD" && -n "$RELEASE_STORE_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Reader signing secrets are incomplete; beta publication is skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare, credentials]
    if: needs.prepare.outputs.channel == 'beta' && needs.credentials.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        releaseA: [false, true]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Prepare signing
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEY_STORE" | base64 --decode > app/reader.jks
          {
            echo "RELEASE_STORE_FILE=./reader.jks"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
          } >> gradle.properties
      - name: Build Reader APKs
        shell: bash
        run: |
          set -euo pipefail
          echo "" > app/src/main/assets/18PlusList.txt
          extra=(-PreaderVersionName="$VERSION" -PreaderVersionCode="$VERSION_CODE")
          variant="release"
          if [[ "${{ matrix.releaseA }}" == "true" ]]; then
            extra+=(-PreaderReleaseA=true)
            variant="releaseA"
          fi
          mkdir -p out
          ./gradlew :app:assembleRelease -ParmOnly=true "${extra[@]}" --build-cache --parallel --warning-mode all
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          cp "$apk" "out/reader_${VERSION}_${variant}.apk"
          rm -rf app/build/outputs/apk
          ./gradlew :app:assembleRelease "${extra[@]}" --build-cache --parallel --warning-mode all
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          cp "$apk" "out/reader_${VERSION}_universal_${variant}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: reader-${{ env.VERSION }}-${{ matrix.releaseA && 'releaseA' || 'release' }}
          if-no-files-found: error
          path: out/*.apk

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.versionCode }}
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare assets and notes
        run: |
          mkdir -p apk
          find artifacts -type f -name '*.apk' -exec cp {} apk/ \;
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            printf '<!-- reader-version-code:%s -->\n' "$VERSION_CODE"
            printf 'Reader %s\n\n' "$VERSION"
            printf 'Build: %s  \nCommit: `%s`  \nBuilt: %s\n\n' "$VERSION_CODE" "${COMMIT_SHA:0:7}" "$built"
            printf '此版本为自动测试版，升级前请备份数据。\n'
          } > release-notes.md
      - name: Publish immutable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')
            if [[ "$existing" != "$COMMIT_SHA" && "$existing" != "${COMMIT_SHA:0:7}" ]]; then
              echo "Tag $TAG already belongs to another commit: $existing" >&2
              exit 1
            fi
            gh release upload "$TAG" apk/*.apk --clobber
            gh release edit "$TAG" --title "Reader $VERSION" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" apk/*.apk --target "$COMMIT_SHA" --title "Reader $VERSION" --notes-file release-notes.md --prerelease
          fi
