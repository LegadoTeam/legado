name: Test Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit on master to build
        required: false
        type: string

concurrency:
  group: test-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:

  prepare:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      versionCode: ${{ steps.set-ver.outputs.versionCode }}
      label: ${{ steps.set-ver.outputs.label }}
      commit: ${{ steps.set-ver.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha || github.sha }}

      - id: set-ver
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || \
            ! git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "Commit must belong to master: $COMMIT_SHA"
            exit 1
          fi
          commit_epoch=$(git show -s --format=%ct "$COMMIT_SHA")
          version="3.$(TZ=Asia/Shanghai date -d "@$commit_epoch" +%y%m%d%H)"
          base_commit=$(sed -n "s/^def versionCodeBaseCommit = '\([^']*\)'.*/\1/p" app/build.gradle)
          base_code=$(awk '/^def versionCodeAtBase = / { print $4 }' app/build.gradle)
          if [[ ! "$base_commit" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "$base_code" =~ ^[0-9]+$ ]]; then
            echo "Unable to read version-code base from app/build.gradle"
            exit 1
          fi
          commit_count=$(git rev-list "${base_commit}..HEAD" --count --no-merges)
          version_code=$((base_code + commit_count))
          current_beta_code=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/beta" \
              --jq '.assets[].name' 2>/dev/null \
              | sed -nE 's/.*[_\.-][vV][cC]([0-9]+)([_\.-].*)?$/\1/p' \
              | sort -nr \
              | head -n 1
          )
          if [[ -z "$current_beta_code" ]]; then
            current_beta_code=$(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/beta" \
                --jq '.body' 2>/dev/null \
                | sed -nE 's/.*legado-version-code:([0-9]+).*/\1/p' \
                | head -n 1
            )
          fi
          if [[ "$current_beta_code" =~ ^[0-9]+$ ]] && \
            (( version_code < current_beta_code )); then
            echo "Refusing beta version-code downgrade: $version_code < $current_beta_code"
            exit 1
          fi
          branch="${GITHUB_REF_NAME//[^[:alnum:]._-]/_}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "versionCode=$version_code" >> "$GITHUB_OUTPUT"
          echo "label=${branch}_${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify Release Credentials
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          LANZOU_ID: ${{ secrets.LANZOU_ID }}
          LANZOU_PSD: ${{ secrets.LANZOU_PSD }}
          LANZOU_FOLDER_ID: ${{ secrets.LANZOU_FOLDER_ID }}
        run: |
          for name in \
            RELEASE_KEY_STORE RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD \
            LANZOU_ID LANZOU_PSD LANZOU_FOLDER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done

  build:
    needs: prepare
    strategy:
      matrix:
        product: [app]
        type: [release, releaseA]
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare Assets
        run: echo "" > "$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt"

      - name: Release APK Sign
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEY_STORE" | base64 --decode \
            > "$GITHUB_WORKSPACE/app/legado.jks"
          {
            printf '%s\n' "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            printf '%s\n' "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_STORE_FILE=./legado.jks"
            echo "RELEASE_KEY_ALIAS=legado"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build With Gradle
        run: |
          sed -i "s/^def version = .*/def version = \"$VERSION\"/" \
            "$GITHUB_WORKSPACE/app/build.gradle"

          if [ "$type" = "release" ]; then
            typeName="新包名"
          else
            typeName="新共存"
            sed -i "s/'.release'/'.releaseA'/" \
              "$GITHUB_WORKSPACE/app/build.gradle"
            if [ -f "$GITHUB_WORKSPACE/app/google-services.json" ]; then
              sed -i 's/.release/.releaseA/' \
                "$GITHUB_WORKSPACE/app/google-services.json"
            fi
          fi

          chmod +x gradlew
          ./gradlew :$product:assembleRelease -ParmOnly=true \
            --build-cache --parallel --daemon --warning-mode all
          mkdir -p "$GITHUB_WORKSPACE/apk"
          bash "$GITHUB_WORKSPACE/.github/scripts/collect-apks.sh" \
            "$GITHUB_WORKSPACE/app/build/outputs/apk" \
            "$GITHUB_WORKSPACE/apk" \
            "$product" "$VERSION" "$typeName" arm

          ./gradlew :$product:assembleRelease \
            --build-cache --parallel --daemon --warning-mode all
          bash "$GITHUB_WORKSPACE/.github/scripts/collect-apks.sh" \
            "$GITHUB_WORKSPACE/app/build/outputs/apk" \
            "$GITHUB_WORKSPACE/apk" \
            "$product" "$VERSION" "$typeName" universal

      - name: Check Build Result
        run: |
          expected_packages=(arm universal)
          mapfile -d '' apks < <(find "$GITHUB_WORKSPACE/apk" -maxdepth 1 \
            -type f -name 'legado_*.apk' -print0)
          if [[ ${#apks[@]} -ne ${#expected_packages[@]} ]]; then
            echo "Expected ${#expected_packages[@]} APKs, found ${#apks[@]}"
            exit 1
          fi

          declare -A verified=()
          for apk in "${apks[@]}"; do
            file_name=$(basename "$apk")
            case "$file_name" in
              *_universal_*) package_kind=universal ;;
              *) package_kind=arm ;;
            esac
            if [[ -n "${verified[$package_kind]:-}" ]]; then
              echo "Multiple APKs detected for $package_kind"
              exit 1
            fi

            packaged_abis=$(unzip -Z1 "$apk" \
              | sed -n 's#^lib/\([^/]*\)/.*#\1#p' \
              | sort -u \
              | paste -sd ' ' -)
            if [[ "$package_kind" = "universal" ]]; then
              expected_native_abis="arm64-v8a armeabi-v7a x86 x86_64"
            else
              expected_native_abis="arm64-v8a armeabi-v7a"
            fi
            if [[ "$packaged_abis" != "$expected_native_abis" ]]; then
              echo "$package_kind APK contains unexpected native ABIs: $packaged_abis"
              exit 1
            fi
            verified[$package_kind]=$apk
          done

          for package_kind in "${expected_packages[@]}"; do
            if [[ -z "${verified[$package_kind]:-}" ]]; then
              echo "Missing APK for $package_kind"
              exit 1
            fi
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: legado.test.${{ env.type }}
          if-no-files-found: error
          path: ${{ github.workspace }}/apk/*.apk

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.versionCode }}
      RELEASE_LABEL: ${{ needs.prepare.outputs.label }}
      ylogin: ${{ secrets.LANZOU_ID }}
      phpdisk_info: ${{ secrets.LANZOU_PSD }}
      LANZOU_FOLDER_ID: ${{ secrets.LANZOU_FOLDER_ID }}
      LANZOU_URL: ${{ secrets.LANZOU_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          path: apk/

      - name: Prepare APKs
        working-directory: apk/
        run: |
          mv */*.apk .
          rm -rf -- */
          for file in *.apk; do
            if [[ "$file" = *新包名* ]]; then
              renamed="${file/新包名/release}"
            else
              renamed="${file/新共存/releaseA}"
            fi
            mv -- "$file" "${renamed%.apk}_vc${VERSION_CODE}.apk"
          done

      - name: Prepare Release Notes
        run: |
          {
            printf '<!-- legado-version-code:%s -->\n' "$VERSION_CODE"
            printf '此版本为提交测试版，可能存在不稳定情况，升级前请备份数据。\n\n'
            bash .github/scripts/extract-latest-update.sh \
              app/src/main/assets/updateLog.md
          } > "$GITHUB_WORKSPACE/release-notes.md"

      - name: Update Beta Tag
        run: |
          git tag --force beta "$(git rev-parse HEAD)"
          git push origin refs/tags/beta --force

      - name: Publish Beta Release
        uses: ncipollo/release-action@v1
        with:
          name: legado_app_${{ env.VERSION }}
          tag: beta
          bodyFile: ${{ github.workspace }}/release-notes.md
          prerelease: true
          makeLatest: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: ${{ github.workspace }}/apk/*.apk

      - name: Update Beta Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit beta \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md"

      - name: Prepare Lanzou APKs
        working-directory: apk/
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/remove-universal-apks.sh" \
            "$GITHUB_WORKSPACE/apk"
          for file in *.apk; do
            renamed="${file/新包名/release}"
            renamed="${renamed/新共存/releaseA}"
            mv -- "$file" "${renamed%.apk}_测试版_${RELEASE_LABEL}.apk"
          done

      - name: Upload To Lanzou
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/lzy_web.py" \
            "$GITHUB_WORKSPACE/apk" "$LANZOU_FOLDER_ID"
          echo "[$(TZ=Asia/Shanghai date '+%Y.%m.%d %H:%M:%S')] 分享链接: $LANZOU_URL"
