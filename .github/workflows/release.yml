name: Reader Stable Release

on:
  workflow_dispatch:

concurrency:
  group: reader-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: master
      - id: version
        run: |
          git fetch origin master --tags
          chmod +x .github/scripts/reader-version.sh
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(bash .github/scripts/reader-version.sh)
          [[ "$(sed -n 's/^channel=//p' reader-version.properties)" == "stable" ]] || {
            echo "Set channel=stable in reader-version.properties and merge that PR before publishing stable." >&2
            exit 1
          }

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        releaseA: [false, true]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.versionCode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Prepare signing
        env:
          RELEASE_KEY_STORE: ${{ secrets.RELEASE_KEY_STORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          for name in RELEASE_KEY_STORE RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD RELEASE_STORE_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          printf '%s' "$RELEASE_KEY_STORE" | base64 --decode > app/reader.jks
          {
            echo "RELEASE_STORE_FILE=./reader.jks"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
          } >> gradle.properties
      - name: Build Reader APKs
        shell: bash
        run: |
          set -euo pipefail
          echo "" > app/src/main/assets/18PlusList.txt
          extra=(-PreaderVersionName="$VERSION" -PreaderVersionCode="$VERSION_CODE")
          variant="release"
          if [[ "${{ matrix.releaseA }}" == "true" ]]; then
            extra+=(-PreaderReleaseA=true)
            variant="releaseA"
          fi
          mkdir -p out
          ./gradlew :app:assembleRelease -ParmOnly=true "${extra[@]}" --build-cache --parallel --warning-mode all
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          cp "$apk" "out/reader_${VERSION}_${variant}.apk"
          rm -rf app/build/outputs/apk
          ./gradlew :app:assembleRelease "${extra[@]}" --build-cache --parallel --warning-mode all
          apk=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          cp "$apk" "out/reader_${VERSION}_universal_${variant}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: reader-stable-${{ matrix.releaseA && 'releaseA' || 'release' }}
          if-no-files-found: error
          path: out/*.apk

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.versionCode }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          find artifacts -type f -name '*.apk' -exec cp {} apk/ \;
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            printf '<!-- reader-version-code:%s -->\n' "$VERSION_CODE"
            printf 'Reader %s\n\n' "$VERSION"
            printf 'Build: %s  \nCommit: `%s`  \nBuilt: %s\n' "$VERSION_CODE" "$(git rev-parse --short=7 HEAD)" "$built"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Stable release already exists: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" apk/*.apk --target "$(git rev-parse HEAD)" --title "Reader $VERSION" --notes-file release-notes.md --latest
