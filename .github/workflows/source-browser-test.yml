  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-browser-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build instrumented test APKs
        run: |
          python3 .github/scripts/prepare-pdf-zoom-fixture.py
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug :app:assembleAppDebugAndroidTest \
            --init-script .github/scripts/source-browser-test.init.gradle \
            --build-cache --no-daemon --max-workers=2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify source browser, discovery and content editor on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-ui-regression.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-browser-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/ui-regression/
            app/schemas/
