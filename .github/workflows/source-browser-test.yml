name: Source Browser Regression

on:
  pull_request:
    paths:
      - '.github/workflows/source-browser-test.yml'
      - '.github/scripts/source-browser-test.init.gradle'
      - 'app/build.gradle'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/java/io/legado/app/ui/widget/dialog/BottomWebViewDialog.kt'
      - 'app/src/main/java/io/legado/app/ui/login/SourceLoginJsExtensions.kt'
      - 'app/src/main/java/io/legado/app/help/JsExtensions.kt'
      - 'app/src/main/java/io/legado/app/utils/HandlerUtils.kt'
      - 'app/src/androidTest/java/io/legado/app/ui/widget/dialog/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-browser-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dialog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build instrumented test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppDebug :app:assembleAppDebugAndroidTest \
            --init-script .github/scripts/source-browser-test.init.gradle \
            --build-cache --no-daemon --max-workers=2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify source browser windows on Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            ./gradlew :app:connectedAppDebugAndroidTest
            --init-script .github/scripts/source-browser-test.init.gradle
            -Pandroid.testInstrumentationRunnerArguments.class=io.legado.app.ui.widget.dialog.BottomWebViewDialogShowTest
            --build-cache --no-daemon --max-workers=2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-browser-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
