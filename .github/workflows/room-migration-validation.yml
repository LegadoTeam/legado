name: Room Migration Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run migration tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: >-
            ./gradlew :app:connectedAppDebugAndroidTest --no-daemon --max-workers=2
            -Pandroid.testInstrumentationRunnerArguments.class=io.legado.app.MigrationTest

      - name: Upload Room schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schema-102
          if-no-files-found: error
          path: app/schemas/io.legado.app.data.AppDatabase/102.json
