name: Sync Upstream (gedoor/legado)

on:
  schedule:
    # 每 12 小时运行一次（UTC 00:00 和 12:00）
    - cron: '0 */12 * * *'
  workflow_dispatch: {}  # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Git identity
        run: |
          git config --global user.name "mgz0227"
          git config --global user.email "miaogongzi0227@gmail.com"

      - name: Add or update upstream
        run: |
          if git remote | grep -q '^upstream$'; then
            git remote set-url upstream https://github.com/gedoor/legado.git
          else
            git remote add upstream https://github.com/gedoor/legado.git
          fi
          git fetch upstream

      - name: Determine default branch
        id: branch
        run: |
          # Determine the default branch pointed to by origin/HEAD (e.g. main or master)
          DEFAULT_BRANCH=$(git rev-parse --abbrev-ref origin/HEAD 2>/dev/null | sed 's@origin/@@')
          # Fallbacks in case origin/HEAD isn't available
          if [ -z "$DEFAULT_BRANCH" ]; then
            if git show-ref --verify --quiet refs/heads/main; then
              DEFAULT_BRANCH=main
            elif git show-ref --verify --quiet refs/heads/master; then
              DEFAULT_BRANCH=master
            else
              DEFAULT_BRANCH=main
            fi
          fi
          echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT

      - name: Check for upstream updates
        id: check
        run: |
          BRANCH="${{ steps.branch.outputs.default_branch }}"
          git fetch upstream "$BRANCH"
          LOCAL=$(git rev-parse "$BRANCH")
          REMOTE=$(git rev-parse "upstream/$BRANCH")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "✅ Already up to date."
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "🔄 Upstream has new commits."
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          BRANCH="${{ steps.branch.outputs.default_branch }}"
          # Ensure the local branch exists and tracks origin
          git checkout "$BRANCH" || git checkout -b "$BRANCH" origin/"$BRANCH"
          git merge --no-edit "upstream/$BRANCH" || true

      - name: Push to origin
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          BRANCH="${{ steps.branch.outputs.default_branch }}"
          git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$BRANCH"
