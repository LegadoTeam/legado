name: PDF Runtime Regression

on:
  pull_request:
    paths:
      - '.github/workflows/pdf-runtime-test.yml'
      - '.github/scripts/pdf-runtime-test.init.gradle'
      - '.github/scripts/run-pdf-runtime.sh'
      - 'app/build.gradle'
      - 'app/*proguard*'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/java/io/legado/app/model/localBook/Pdf*'
      - 'app/src/pdfRuntime/**'
      - 'app/src/androidTest/assets/pdf*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minified-api-23:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build minified release with platform instrumentation
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease \
            --init-script .github/scripts/pdf-runtime-test.init.gradle \
            --build-cache --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify PDF outlines and rendering on Android 6
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-pdf-runtime.sh
      - name: Upload results and release mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf-runtime-api-23
          path: |
            app/build/pdf-runtime/
            app/build/outputs/mapping/appRelease/
