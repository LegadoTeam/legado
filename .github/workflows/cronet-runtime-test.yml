name: Cronet Runtime Regression

on:
  pull_request:
    paths:
      - '.github/workflows/cronet-runtime-test.yml'
      - '.github/scripts/cronet-runtime-test.init.gradle'
      - 'app/cronetlib/**'
      - 'app/*proguard*'
      - 'app/build.gradle'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/assets/cronet.json'
      - 'app/src/main/java/io/legado/app/lib/cronet/**'
      - 'app/src/main/java/io/legado/app/help/http/Cronet.kt'
      - 'app/src/cronetAndroidTest/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cronet-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build minified release and focused test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease :app:assembleAppReleaseAndroidTest \
            --init-script .github/scripts/cronet-runtime-test.init.gradle \
            --build-cache --no-daemon --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify selected native Cronet in release
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedAppReleaseAndroidTest --init-script .github/scripts/cronet-runtime-test.init.gradle -Pandroid.testInstrumentationRunnerArguments.class=io.legado.app.lib.cronet.CronetRuntimeTest --build-cache --no-daemon --max-workers=2
      - name: Upload test results and release mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cronet-runtime-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/mapping/appRelease/
