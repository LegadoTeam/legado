name: 功能请求 / Feature Request
description: 建议可以解决明确使用场景的新功能
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，没有相同或相关的请求
          required: true
        - label: 最新[测试版](https://github.com/LegadoTeam/legado/releases/beta)尚未提供此功能
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - Android
        - Web
        - Android 与 Web
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 阅读文本与翻页
        - 漫画阅读
        - 朗读与音频
        - 书架与书籍管理
        - 书源与规则解析
        - Web 服务与前端
        - 备份、同步与数据
        - 构建、安装与更新
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明目前遇到的限制，以及谁会从此功能中受益。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的操作流程和结果，无需提供具体代码实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 说明已经尝试过的替代方式，或可以接受的简化方案。

  - type: input
    id: version
    attributes:
      label: 阅读版本
      placeholder: 3.26.080404

  - type: textarea
    id: demo
    attributes:
      label: 补充材料
      placeholder: 可拖入草图、截图或可借鉴的产品链接。
