name: 功能请求 / Feature Request
description: 建议可以解决明确使用场景的新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请仅提交面向通用场景、能够服务多数用户且符合项目定位的需求。仅涉及个人偏好、私人工作流或特殊环境的定制需求可能不会受理；本项目也不会把 AI 作为个人定制需求的入口。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，没有相同或相关的请求
          required: true
        - label: 最新[测试版](https://github.com/LegadoTeam/legado/releases/beta)尚未提供此功能
          required: true
        - label: 这个需求具有普遍价值，不是仅服务于个人偏好、私人工作流或特殊环境
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: 目标平台
      options:
        - Android
        - Web
        - Android 与 Web
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 阅读文本与翻页
        - 漫画阅读
        - 朗读与音频
        - 书架与书籍管理
        - 书源与规则解析
        - Web 服务与前端
        - 备份、同步与数据
        - 构建、安装与更新
        - 其他或不确定
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 要解决的普遍问题
      description: 说明目前遇到的通用限制，以及不增加此功能会造成的影响；不要只描述个人偏好。
    validations:
      required: true

  - type: textarea
    id: beneficiaries
    attributes:
      label: 受益用户与使用场景
      description: 说明哪些用户群体会受益、使用频率和可复用的实际场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的操作流程和结果，无需提供具体代码实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有功能与替代方案
      description: 说明现有功能是否能够解决问题、已经尝试过的替代方式，以及可以接受的简化方案。
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 相关 Issue 与查重结果
      description: 列出搜索关键词、相关 Issue 或讨论链接；如没有相关内容，请说明搜索范围。
    validations:
      required: true

  - type: textarea
    id: project_fit
    attributes:
      label: 通用性与项目定位
      description: 说明为什么该需求适合由 Legado 提供，以及它如何服务多数用户而不是单一用户。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 阅读版本
      placeholder: 3.26.080404

  - type: textarea
    id: demo
    attributes:
      label: 补充材料
      placeholder: 可拖入草图、截图或可借鉴的产品链接。
