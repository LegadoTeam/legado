bug:
  - '/-\s*\[[xX]\]\s*Bug 修复/'
enhancement:
  - '/-\s*\[[xX]\]\s*新功能/'
documentation:
  - '/-\s*\[[xX]\]\s*文档/'
maintenance:
  - '/-\s*\[[xX]\]\s*重构或维护/'

'platform: android':
  - '/(### (运行|目标)平台\r?\n\r?\nAndroid[ \t]*$|-\s*\[[xX]\]\s*Android[ \t]*$)/m'
'platform: web':
  - '/(### (运行|目标)平台\r?\n\r?\nWeb[ \t]*$|-\s*\[[xX]\]\s*Web[ \t]*$)/m'
'platform: shared':
  - '/(### (运行|目标)平台\r?\n\r?\nAndroid 与 Web[ \t]*$|-\s*\[[xX]\]\s*Android 与 Web[ \t]*$)/m'

'area: reader':
  - '/(### 影响模块\s+阅读文本与翻页|-\s*\[[xX]\]\s*阅读文本与翻页)/'
  - '/^(?!\s*[-+*]\s+\[\s\]\s+)[^\r\n]*(翻页|正文|段评|章评|阅读界面|阅读页|阅读模式)/im'
'area: manga':
  - '/(### 影响模块\s+漫画阅读|-\s*\[[xX]\]\s*漫画阅读)/'
  - '/^(?!\s*[-+*]\s+\[\s\]\s+)[^\r\n]*(漫画|条漫)/im'
'area: audio':
  - '/(### 影响模块\s+朗读与音频|-\s*\[[xX]\]\s*朗读与音频)/'
  - '/^(?!\s*[-+*]\s+\[\s\]\s+)[^\r\n]*(朗读|听书|TTS|音频)/im'
