          - 'gradle/**'
          - 'gradle.properties'
          - 'settings.gradle'
'area: automation':
  - changed-files:
      - any-glob-to-any-file: '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README*.md'
          - 'docs/**'
          - 'app/src/main/assets/help/**'
