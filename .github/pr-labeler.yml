'platform: android':
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**'
          - 'modules/book/**'
          - 'modules/rhino/**'
'platform: web':
  - changed-files:
      - any-glob-to-any-file: 'modules/web/**'

'area: reader':
  - changed-files:
