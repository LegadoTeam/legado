          - '**/src/androidTest/**'
          - 'modules/web/tests/**'
          - '.github/scripts/test-*'
kotlin:
  - changed-files:
      - any-glob-to-any-file: '**/*.kt'
java:
  - changed-files:
      - any-glob-to-any-file: '**/*.java'
javascript:
  - changed-files:
      - any-glob-to-any-file:
          - 'modules/web/**/*.js'
          - 'modules/web/**/*.ts'
          - 'modules/web/**/*.vue'
