gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { android ->
            // Exercise release shrinking with a CI-only key; production signing is unchanged.
            android.testBuildType = 'release'
            android.buildTypes.getByName('release').signingConfig = android.signingConfigs.getByName('debug')
            // Do not let unrelated UI test references keep otherwise-shrunk application code.
            android.sourceSets.getByName('androidTest').java.setSrcDirs(['src/cronetAndroidTest/java'])
        }
    }
}
