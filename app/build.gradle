apply from: 'download.gradle'
apply from: 'cronet-loader.gradle'

def readerVersionProperties = new Properties()
def readerVersionFile = rootProject.file("reader-version.properties")
if (readerVersionFile.exists()) {
    readerVersionFile.withInputStream { readerVersionProperties.load(it) }
}
def readerBaseVersion = readerVersionProperties.getProperty("baseVersion", "1.0.0")
def readerReleaseChannel = readerVersionProperties.getProperty("channel", "beta")
def versionCodeBaseCommit = readerVersionProperties.getProperty(
        "versionCodeBaseCommit",
        "a0c2fecbcffe59c918175fd23fa922a7ae9bd2bd"
)
def versionCodeBaseValue = readerVersionProperties.getProperty("versionCodeBaseValue", "38520").toInteger()
def versionCodeValue = versionCodeBaseValue + 1
try {
    def gitCount = providers.exec {
        commandLine 'git', 'rev-list', "${versionCodeBaseCommit}..HEAD", '--first-parent', '--count'
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
    if (gitCount) {
        versionCodeValue = versionCodeBaseValue + Integer.parseInt(gitCount)
    }
} catch (ignored) {
    // Keep source archives buildable when Git is unavailable.
}
def version = project.findProperty("readerVersionName")?.toString()
        ?: (readerReleaseChannel == "stable"
        ? readerBaseVersion
        : "${readerBaseVersion}-beta.0")
def readerVersionCodeOverride = project.findProperty("readerVersionCode")?.toString()?.toInteger()
if (readerVersionCodeOverride != null) {
    versionCodeValue = readerVersionCodeOverride
}
def name = "reader"
def readerVersion = version
def readerApplicationId = "io.github.yuanxiaoaihezhou.reader"
def armOnly = project.findProperty("armOnly")?.toBoolean() ?: false

android {
    compileSdk = compile_sdk_version
    namespace = 'io.legado.app'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId readerApplicationId
        minSdk 23
        targetSdk 36
        versionCode = versionCodeValue
        versionName readerVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep app translations while dropping unused transitive dependency locales.
        resourceConfigurations += [
                'en',
                'es-rES',
                'ja-rJP',
                'pt-rBR',
                'vi',
                'zh',
                // AndroidX stores Simplified Chinese switch labels under zh-rCN.
                'zh-rCN',
                'zh-rHK',
                'zh-rTW'
        ]
        project.ext.set("archivesBaseName", name + "_" + version)

        if (armOnly) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            if (project.findProperty("readerReleaseA")?.toString()?.toBoolean()) {
                applicationIdSuffix '.releaseA'
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig = signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled = (project.findProperty('ciMinifyDebug')?.toString() == 'true')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 璁惧畾Room鐨凨SP鍙傛暟
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources.excludes.add('META-INF/*')
        // R8 removes the transcode implementation; these bundled resources have no runtime reader.
        resources.excludes.addAll([
                'tables/Transcoder_*.bin',
                '*.proto',
                '**/*.proto',
                'src/**',
                // kotlin-reflect and its builtins loaders are not part of the release runtime.
                'kotlin/*.kotlin_builtins',
                'kotlin/**/*.kotlin_builtins'
        ])
        jniLibs {
            // These dependencies already ship stripped; skip redundant strip attempts.
            keepDebugSymbols += [
                    '**/libandroidx.graphics.path.so',
                    '**/libarchive-jni.so',
                    '**/libdatastore_shared_counter.so',
                    '**/libimage_processing_util_jni.so',
                    '**/librenderscript-toolkit.so',
                    '**/librtmp-jni.so',
                    '**/libsurface_util_jni.so'
            ]
        }
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //蹇界暐string缈昏瘧缂哄け锛屽悗闈㈤渶瑕佺炕璇戞椂鍘绘帀锛宼odo
        disable 'MissingTranslation'
    }
}

